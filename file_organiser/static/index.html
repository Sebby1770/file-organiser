<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>File Organiser</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="mark"></span>File Organiser</div>
      <form class="pathbar" id="path-form">
        <input id="path" type="text" spellcheck="false" placeholder="/Users/you/Downloads" />
        <button class="btn" type="submit">Scan</button>
      </form>
      <p class="status" id="status">Pick a folder. Scan. See where the bytes went.</p>
    </header>
    <div class="shell">
      <aside class="rail" id="roots"></aside>
      <section class="stage">
        <canvas id="sun" width="720" height="720" aria-label="Disk map"></canvas>
        <p class="crumb" id="crumb"></p>
      </section>
      <aside class="inspect" id="inspect">
        <p class="eyebrow">Inspector</p>
        <h2 id="i-name">—</h2>
        <p class="size" id="i-size">—</p>
        <p class="meta" id="i-meta">Click a slice.</p>
        <div class="cta" id="i-actions" hidden>
          <button class="btn ghost" type="button" id="reveal">Reveal</button>
          <button class="btn danger" type="button" id="trash">Trash</button>
          <button class="btn ghost" type="button" id="why">Why</button>
        </div>
        <pre class="why" id="i-why" hidden></pre>
      </aside>
    </div>
    <section class="dock">
      <nav class="tabs" id="tabs">
        <button type="button" data-tab="largest" class="on">Largest</button>
        <button type="button" data-tab="stale">Stale</button>
        <button type="button" data-tab="cats">Types</button>
        <button type="button" data-tab="dupes">Duplicates</button>
        <button type="button" data-tab="plan">Organize</button>
      </nav>
      <div class="tab on" id="tab-largest"></div>
      <div class="tab" id="tab-stale"></div>
      <div class="tab" id="tab-cats"></div>
      <div class="tab" id="tab-dupes"></div>
      <div class="tab" id="tab-plan"></div>
    </section>
    <script src="/sunburst.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
