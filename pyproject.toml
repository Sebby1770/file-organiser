[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organiser"
version = "4.0.0"
description = "Desktop app that scans your computer and tells you what to delete, what to review, and what to keep."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sebastian Forbes" }]
keywords = ["files", "organiser", "organizer", "cli", "duplicates", "watch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "send2trash>=1.8",
]

[project.optional-dependencies]
watch = ["watchdog>=3.0.0"]
trash = ["send2trash>=1.8"]
test = ["pytest>=7"]

[project.scripts]
file-organiser = "file_organiser.cli:main"
file-organizer = "file_organiser.cli:main"

[project.gui-scripts]
FileOrganiser = "file_organiser.launch:run_desktop"

[project.urls]
Homepage = "https://sebby1770.github.io/file-organiser/"
Repository = "https://github.com/Sebby1770/file-organiser"
Issues = "https://github.com/Sebby1770/file-organiser/issues"

[tool.setuptools.packages.find]
include = ["file_organiser*"]

[tool.setuptools.package-data]
file_organiser = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
