name: release-app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset: FileOrganiser-macos-runner.zip
          - os: windows-latest
            platform: windows
            asset: FileOrganiser-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            asset: FileOrganiser-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .
      - name: Run tests before packaging
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Build app
        run: python scripts/build_app.py
      - name: Package macOS runner build
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/FileOrganiser.app release/${{ matrix.asset }}
      - name: Package Windows x64 build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path dist/FileOrganiser.exe -DestinationPath release/${{ matrix.asset }}
      - name: Package Linux x86_64 build
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          tar -C dist -czf release/${{ matrix.asset }} FileOrganiser
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release-asset
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release-asset"
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 manifest
        working-directory: release-assets
        run: sha256sum FileOrganiser-* > SHA256SUMS.txt
      - name: Create or update durable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "File Organiser $TAG" --notes "Unsigned technical-evaluator builds. Gatekeeper or SmartScreen may warn or block them. Verify SHA256SUMS.txt and do not disable operating-system security globally." --repo "$GITHUB_REPOSITORY"
          fi
