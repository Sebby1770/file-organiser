name: Pro early-access interest
description: Help validate the paid plan. Do not include filenames, paths, payment details, or other sensitive data.
title: "[Pro interest] "
labels: ["pro-interest"]
body:
  - type: markdown
    attributes:
      value: |
        Checkout is not live and this form does not reserve a licence or price. It is a public GitHub issue. Share product needs only—never private file data, credentials, or payment information.
  - type: dropdown
    id: platform
    attributes:
      label: Primary platform
      options:
        - macOS
        - Windows
        - Linux
        - More than one
    validations:
      required: true
  - type: dropdown
    id: buyer
    attributes:
      label: Intended use
      options:
        - Personal computer
        - Small business
        - IT-managed workplace
        - Evaluating only
    validations:
      required: true
  - type: checkboxes
    id: value
    attributes:
      label: Which planned benefits matter?
      options:
        - label: Signed and notarised installer
        - label: Managed updates
        - label: Scan history and comparisons
        - label: Scheduled reminders
        - label: Support response target
  - type: dropdown
    id: price
    attributes:
      label: Would a US$19 one-time founding price feel reasonable if those benefits work?
      options:
        - Yes
        - Maybe; I need to test it
        - No
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would make it worth paying for?
      description: Keep this general. Do not paste a file listing, exported report, username, home path, or employer data.
      placeholder: "Example: a signed app that helps me review Downloads monthly without guessing."
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public issue acknowledgement
      options:
        - label: I understand this is public, not checkout, and I have not included sensitive information.
          required: true
